<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In — AquaLedger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="card" style="max-width:440px;width:100%">
    <h1 style="font-size:20px;margin-bottom:6px">AquaLedger Account</h1>
    <p style="font-size:13px;color:#475569;margin-bottom:16px">Sign in or create a household account. Demo: alex@aqualedger.edu / demo123</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash flash-error" style="margin-bottom:12px">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post" style="display:grid;gap:10px;margin-bottom:20px">
      <input type="hidden" name="mode" value="login" />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
    <hr style="border:none;border-top:1px solid #e2e8f0;margin:16px 0" />
    <h2 style="font-size:15px;margin-bottom:10px">Create New Household</h2>
    <form method="post" style="display:grid;gap:10px">
      <input type="hidden" name="mode" value="register" />
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="text" name="household_name" placeholder="Household Name" required />
      <input type="number" name="household_size" value="3" min="1" max="20" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" minlength="4" required />
      <button type="submit" class="btn">Create Account</button>
    </form>
  </div>
</body>
</html>
